services:
  flask-app:
    build:
      context: app
      dockerfile: ../docker/Dockerfile.libraries
      secrets:
        - netrc
    restart: always
    ports:
      - 8000:8000
    networks:
      - backnet
      - frontnet
  nginx:
    build: nginx
    restart: always
    ports:
      - 80:80
    depends_on:
      - flask-app
    networks:
      - frontnet

networks:
  backnet:
  frontnet:

secrets:
  netrc:
    file: ./.netrc
